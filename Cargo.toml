[package]
name = "voxara"
version = "1.0.0"
edition = "2021"
description = "Real-Time Native Rust Cleft-Palate Speech Clarifier & Voice Studio"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
cpal = "0.15"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
